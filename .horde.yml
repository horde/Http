---
id: Http
name: Http
full: HTTP client library
description: A php-fig compliant library for working with Uris, HTTP requests and responses including PSR-7 messages, PSR-17 factories, PSR-18 client. See also horde/http_server for PSR-15 middlewares
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Http
authors:
  - name: Jan Schneider
    user: jan
    email: jan@horde.org
    active: true
    role: lead
  - name: Chuck Hagenbuch
    user: chuck
    email: chuck@horde.org
    active: false
    role: lead
version:
  release: 3.1.0
  api: 3.0.0
state:
  release: stable
  api: stable
license:
  identifier: BSD-2-Clause
  uri: http://www.horde.org/licenses/bsd
provides:
  psr/http-message-implementation: ^2
  psr/http-factory-implementation: ^1.0.2
  psr/http-client-implementation: ^1.0.3
dependencies:
  required:
    php: ^8.1
    composer:
      horde/exception: ^3
      horde/support: ^3
      psr/http-message: ^2
      psr/http-factory: ^1.0.2
      psr/http-client: ^1.0.3
  dev:
    composer:
      horde/url: ^3
  optional:
    ext:
      curl: '*'
      http: '*'
vendor: horde
quality:
  phpstan:
    level: 9
keywords:
  - PSR-18 http client
  - PSR-7 shapes
  - HTTP Factories
ci-platform:
  '8.1':
    - php: ^8.1
    - ext-dom
  '8.2':
    - php: ^8.2
    - ext-dom
  '8.3':
    - php: ^8.3
    - ext-dom
  '8.4':
    - php: ^8.4
    - ext-dom
  '8.5':
    - php: ^8.5
    - ext-dom
  '8.6':
    - php: ^8.6
    - ext-dom
ci-platform-flags:
  needs_installer_plugin: false
